[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-vlr"
version = "0.1.0"
description = "Crawlora VLR.gg API client with 23 endpoints for Valorant matches, events, results, rankings, statistics, news, and forum data"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "vlr", "vlr-gg", "vlr-api", "vlr-gg-api", "vlr-scraper", "vlr-gg-scraper", "vlr-data", "vlr-gg-data", "vlr-valorant-matches", "vlr-events", "vlr-results", "vlr-rankings", "vlr-statistics", "vlr-news", "vlr-forum-data"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=vlr-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=vlr-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-vlr"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_vlr"]

[tool.setuptools.package-data]
"crawlora_vlr" = ["py.typed", "*.pyi"]
